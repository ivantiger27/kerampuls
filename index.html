<body>
<div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, getDoc, getDocs, writeBatch, addDoc, query, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6BkylVnAh3gWQmARZEHj8o9YSK4J8lOo",
  authDomain: "kerampuls.firebaseapp.com",
  projectId: "kerampuls",
  appId: "1:718382916991:web:c4255adef4d0ecb0dee64a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= данные завода (как в приложении) ================= */
const DRYERS = [
  {name:"Ева 1", id:"eva1", shelves:252, lap:84, line:1},
  {name:"Ева 2", id:"eva2", shelves:252, lap:114.28, line:2},
  {name:"Ева 3", id:"eva3", shelves:252, lap:84, line:3},
  {name:"Ева 4", id:"eva4", shelves:324, lap:99.5, line:4}
];
const MODEL = d=> d.shelves===252 ? "SACMI EVA 783 · 21 поддон × 12 ярусов" : d.shelves===324 ? "SACMI EVA 983 · 27 поддонов × 12 ярусов" : "SACMI EVA";
const EVA_MAX = 7.5, PRESS_MAX = 20;
const FORMATS = {"300x300":15, "600x600":4, "1200x600":2};
const ROLES = {press:"Прессовщик", glaze:"Оператор глазури", lab:"Лаборант", master:"Мастер смены", chief:"Начальник смены", viewer:"Наблюдатель"};
const ROLE_CHOICES = ["press","glaze","lab","master","chief"];
const ST = {run:"Работает", idle:"Простой", off:"Выключен"};
const QUICK = ["Принято","Нужен мастер","Требуется наладчик","Пошла тестовая полка","Остановка на чистку"];
const PLACES = ["Линия 1","Линия 2","Линия 3","Линия 4","Другое"];
const defectsFor = r=> (r==="master"||r==="chief") ? ["Трещина","Скол","Геометрия","Недолив глазури","Сбой печати","Бой"]
  : r==="glaze" ? ["Недолив глазури","Сбой печати","Скол","Бой"]
  : r==="lab" ? ["Геометрия","Влажность","Оттенок","Трещина","Скол","Бой"] : ["Трещина","Скол","Геометрия","Бой"];
const pressPanel = i=> i<=3 ? "кнопочный пульт (старый)" : "сенсорный пульт";
const isLead = r=> r==="master"||r==="chief";

/* ================= расчёт Евы (как в приложении) ================= */
const mod = (a,n)=>((a%n)+n)%n;
const evaDef = d=>({synced:false, refPos:0, refTime:0, running:true, rate:d.shelves/d.lap, fmt:"", tpm:0});
const pos = (e,now)=> (!e.synced||!e.running||e.off) ? e.refPos : e.refPos + (now-e.refTime)/60000*e.rate;
const shelfNow = (e,now,n)=> mod(Math.floor(pos(e,now)),n)+1;
const leftSh = (t,e,now)=> Math.max(0, t.target-pos(e,now));
const remSec = (t,e,now)=> e.rate>0 ? leftSh(t,e,now)/e.rate*60 : 1e9;
function evaSynced(e,c,n,now){
  let np;
  if(!e.synced) np=c-1;
  else { const p=pos(e,now); let diff=(c-1)-mod(p,n); if(diff>n/2) diff-=n; else if(diff<-n/2) diff+=n; np=p+diff; }
  return {...e, synced:true, refPos:np, refTime:now};
}
function retarget(t,old,fresh,c,n,now){
  const arrived = old.synced && (t.target-pos(old,now))<=0.5;
  if(arrived) return {...t, target:fresh.refPos};
  let l = mod(t.testShelf-c,n); if(l===0) l=n;
  return {...t, target:fresh.refPos+l};
}
const toggled = (e,now)=> e.running ? {...e, refPos:pos(e,now), refTime:now, running:false} : {...e, refTime:now, running:true};
const rated = (e,rate,fmt,tpm,now)=>({...e, refPos:pos(e,now), refTime:now, rate, fmt, tpm});

/* ================= форматирование ================= */
const pad3 = n=>String(n).padStart(3,"0");
const pad2 = n=>String(n).padStart(2,"0");
const clock = ms=>{const d=new Date(ms); return pad2(d.getHours())+":"+pad2(d.getMinutes());};
const fmtDur = sec=>{const t=Math.max(0,Math.ceil(sec)); const h=Math.floor(t/3600), m=Math.floor((t%3600)/60); return h>0? h+" ч "+m+" мин" : m+" мин";};
const mmss = sec=>{const t=Math.max(0,Math.floor(sec)); return pad2(Math.floor(t/60))+":"+pad2(t%60);};
const fmtStop = sec=>{const t=Math.max(0,Math.floor(sec)); return t>=60 ? Math.floor(t/60)+" мин "+(t%60)+" с" : t+" с";};
const rateTxt = r=>(+r).toFixed(2).replace(".",",");
const trim = x=>String(+(+x).toFixed(2));
const num = v=>{ const x=parseFloat(String(v??"").replace(",",".")); return isFinite(x)?x:0; };
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayKey = ts=>{const d=new Date(ts); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();};
const dayLabel = ts=>{ if(dayKey(ts)===dayKey(Date.now())) return "Сегодня"; if(dayKey(ts)===dayKey(Date.now()-864e5)) return "Вчера"; return new Date(ts).toLocaleDateString("ru-RU",{day:"numeric",month:"long"}); };
const fmtLabel = f=>(f||"").replace("x","×");
const initials = n=>(n||"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
const ls=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } };
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ================= смены (как в приложении) ================= */
const CYC=["День","Ночь","Отсыпной","Выходной"], ANCHOR=Date.UTC(2026,10,22)/86400000, MAXSH=12*3600000, BR_OFFSETS=[1,3,0,-2];
const shiftTs=()=>+ls("shift_"+user.uid)||0;
const onShift=()=>shiftTs()>0&&Date.now()-shiftTs()<MAXSH;
const brigade=()=>+ls("brigade")||0;
function sched(){
  const b=brigade(); if(!b) return null;
  const t=new Date(Date.now()+5*3600000), h=t.getUTCHours(), day0=Math.floor(t.getTime()/86400000);
  const isDay=h>=8&&h<20, sd=h<8?day0-1:day0;
  const idx=((sd-ANCHOR+BR_OFFSETS[b-1])%4+4)%4, mine=isDay?idx===0:idx===1;
  return mine?{n:CYC[idx],mine:true}:{n:CYC[((day0-ANCHOR+BR_OFFSETS[b-1])%4+4)%4],mine:false};
}
const endingStart=()=>{ const s=shiftStart(), n=Date.now(); return n-s<20*60000 ? s-12*3600000 : s; };
const nearEnd=()=>{ const s=shiftStart(), n=Date.now(); return n>=s+10*3600000-20*60000 };
const zeroed=()=>[1,2,3,4,5,6].some(i=>(pressOf(i).outTs||0)>=endingStart());
const shiftStart=()=>{ const t=new Date(Date.now()+5*3600000), h=t.getUTCHours(), d0=Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()); return (h<8?d0-4*3600000:h<20?d0+3*3600000:d0+15*3600000); };

/* ================= состояние ================= */
let user=null, role="viewer", nick="", tab=ls("tab")||"dry", evsel=0;
let presses={}, evas={}, tests=[], journal=[], chat=[], accepts={}, task=null, acks=[], avatars={};
let unsubs=[], pendPhoto=null, helpPress=0, helpQ="", helpOpen=null, taskOpen=false;
const root=document.getElementById("root");
const evaOf = d=> evas[d.id] || evaDef(d);
const canPress = ()=> role==="press" && onShift();
const pressOf = i=> presses[i] || {state:"off", eva:0, fmt:"", tpm:0, cpm:0, per:1, pressure:0, pressTs:0, deaer:0, outM2:0, outTs:0, by:"", ts:0};
const theme = v=>{ if(v===undefined) return ls("theme")||"auto"; ls("theme",v); applyTheme(); };
function applyTheme(){ const t=theme(); if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t); }
applyTheme();

/* ================= вход ================= */
function roleOf(email){ const l=(email||"").split("@")[0]; for(const r of ["chief","master","press","glaze","lab"]) if(l.startsWith(r)) return r; return "viewer"; }
function renderLogin(err=""){
  document.body.className="";
  root.innerHTML = `<div class="login"><h1>КерамПульс</h1><p class="small">Вход для сотрудников</p>
  <input id="lg" placeholder="Логин" autocapitalize="off" autocomplete="username">
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <div class="err">${esc(err)}</div><button class="ok big" id="go">Войти</button></div>`;
  document.getElementById("go").onclick = async ()=>{
    const l=document.getElementById("lg").value.trim().toLowerCase(), p=document.getElementById("pw").value;
    try{ await signInWithEmailAndPassword(auth, l.includes("@")?l:l+"@keram.app", p); }

function startData(){

  dataStarted=true;
  buildShell();
  const sub=(q,f)=>unsubs.push(onSnapshot(q,f,()=>{}));
  sub(collection(db,"presses"), s=>{ presses={}; s.forEach(d=>{ const x=d.data(); presses[+d.id.replace("p","")]={state:x.state||"off", eva:+x.eva||0, fmt:x.fmt||"", tpm:num(x.tpm), cpm:num(x.cpm), per:Math.max(1,+x.per||1), pressure:num(x.pressure), pressTs:+x.pressTs||0, deaer:num(x.deaer), outM2:num(x.outM2), outTs:+x.outTs||0, by:x.by||"", ts:+x.ts||0}; }); render(); });
  sub(collection(db,"evas"), s=>{ evas={}; s.forEach(d=>{ const x=d.data(), dd=DRYERS.find(z=>z.id===d.id); if(dd){ const r=num(x.rate); evas[d.id]={synced:!!x.synced, refPos:num(x.refPos), refTime:+x.refTime||0, running:x.running!==false, rate:(r>0.05&&r<30)?r:dd.shelves/dd.lap, fmt:x.fmt||"", tpm:num(x.tpm), off:!!x.off}; } }); render(); });
  sub(collection(db,"tests"), s=>{ tests=[]; s.forEach(d=>{ const x=d.data(); if(DRYERS.some(z=>z.name===x.dryer)) tests.push({id:+x.id, dryer:x.dryer, design:x.design||"", testShelf:+x.testShelf, target:num(x.target), author:x.author||"", exitTs:+x.exitTs||0}); }); render(); });
  sub(query(collection(db,"chats","journal","messages"),orderBy("ts","desc"),limit(100)), s=>{ journal=s.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data()})); render(); });
  sub(query(collection(db,"chats","general","messages"),orderBy("ts","desc"),limit(80)), s=>{ chat=s.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data()})).reverse(); render(true); });
  sub(query(collection(db,"accepts"),orderBy("ts","desc"),limit(150)), s=>{ accepts={}; s.forEach(d=>{ const x=d.data(); (accepts[x.msg] ||= []).push(x); }); render(); });
  sub(doc(db,"config","shift_task"), s=>{ const x=s.exists()?s.data():null; task=(x&&(x.text||"").trim())?{text:x.text, by:x.by||"", ts:+x.ts||0, photo:x.photo||"", thumb:x.thumb||""}:null; subAcks(); render(); });
  sub(collection(db,"avatars"), s=>{ avatars={}; s.forEach(d=>{ const x=d.data(); if(x.img) avatars[d.id]=x.img; }); render(); });
}
let ackUnsub=null, ackTs=null;

  if(ackUnsub){ ackUnsub(); ackUnsub=null; } acks=[];
  if(ts) ackUnsub=onSnapshot(query(collection(db,"acks"),where("task","==",ts)), s=>{ acks=s.docs.map(d=>d.data().uid); render(); });
}

function pressMap(p,now){ return {state:p.state, eva:p.eva, fmt:p.fmt, tpm:p.tpm, cpm:p.cpm, per:p.per, pressure:p.pressure, pressTs:p.pressure>0?now:0, deaer:p.deaer||0, outM2:p.outM2||0, outTs:p.outTs||0, by:nick, ts:now}; }
function savePress(id,p,quiet){
  const now=Date.now(), b=writeBatch(db);

    Object.values(all).forEach(x=>{ if(x.state==="run"&&x.eva===p.eva&&x.tpm>0) total+=x.tpm; });
    b.set(doc(db,"evas",d.id), evaMap(rated(evaOf(d),Math.min(total/tps,EVA_MAX),p.fmt,total,now)));

function fileToPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const sc=max=>{ const k=Math.max(img.width,img.height)/max; const w=k>1?Math.round(img.width/k):img.width, h=k>1?Math.round(img.height/k):img.height; const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); return c; };
      const big=sc(1280); let q=0.65, full=big.toDataURL("image/jpeg",q).split(",")[1];
      while(full.length>600000&&q>0.3){ q-=0.1; full=big.toDataURL("image/jpeg",q).split(",")[1]; }
      const thumb=sc(320).toDataURL("image/jpeg",0.55).split(",")[1];
      const side=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=160;
      c.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);
      const avatar=c.toDataURL("image/jpeg",0.7).split(",")[1];
      URL.revokeObjectURL(url); res({full,thumb,avatar});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}
function pickPhoto(cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; try{ cb(await fileToPhoto(f)); }catch(e){ toast("Не удалось прочитать фото"); } };
  inp.click();
}

function schemeHtml(){

    const srcs=idx.data().sources||{}, ids=[]; kbNames={};
    for(const [k,v] of Object.entries(srcs)){ kbNames[k]=v.name||k; for(let n=0;n<(v.parts||0);n++) ids.push(k+"_"+n); }
    const docs=await Promise.all(ids.map(id=>getDoc(doc(db,"kb",id))));
    kb=[]; docs.forEach(s=>{ if(!s.exists()) return; const x=s.data(); (x.items||[]).forEach(it=>kb.push({src:x.src,...it})); });
    kbState="ok";
  }catch(e){ kbState="error"; }
  render();
}
async function uploadKb(file){
  if(!file) return;
  try{
    const data=JSON.parse(await file.text()), index={}; let total=0;
    for(const [k,s] of Object.entries(data.sources)){
      const items=s.items.map(o=>({c:o.c||"",t:o.t||"",k:o.k||"",d:o.d||"",s:o.s||""}));
      const parts=[]; for(let i=0;i<items.length;i+=100) parts.push(items.slice(i,i+100));
      await Promise.all(parts.map((p,n)=>setDoc(doc(db,"kb",k+"_"+n),{src:k,n,items:p})));
      index[k]={name:s.name||k,parts:parts.length}; total+=items.length;
    }
    await setDoc(doc(db,"kb","index"),{sources:index,ts:Date.now()});
    kb=null; kbState=""; toast("Справочник загружен: "+total+" записей"); render();
  }catch(e){ toast("Ошибка файла или правил базы"); }
}
const kbSources=p=> p>=1&&p<=3?["old"]:p>=4&&p<=6?["touch","ph620"]:["old","touch","ph620"];
function helpFound(){
  const q=helpQ.trim().toLowerCase(); if(!q||!kb) return [];
  const pool=kb.filter(a=>(helpMode===1?paramSources:kbSources)(helpPress).includes(a.src));
  if(helpMode===0&&/^\d+$/.test(q)){ const code=q.padStart(4,"0"); const ex=pool.filter(a=>a.c===code); return (ex.length?ex:pool.filter(a=>a.c.startsWith(q)||a.c.endsWith(q))).slice(0,60); }
  const ws=q.replace(/ё/g,"е").split(/\s+/).filter(w=>w.length>=2).map(w=>w.length>=6?w.slice(0,-2):w);   // «деаэрация» найдёт и «деаэрации»
  return pool.filter(a=>{ const h=(a.t+" "+a.d+" "+(a.s||"")).toLowerCase().replace(/ё/g,"е"); return ws.every(w=>h.includes(w)); })
    .sort((a,b)=>(ws.every(w=>a.t.toLowerCase().includes(w))?0:1)-(ws.every(w=>b.t.toLowerCase().includes(w))?0:1)).slice(0,60);
}
function kbSnippet(d,q){
  let w=q.trim().toLowerCase().split(/\s+/).find(x=>x.length>=2); if(!w) return d; if(w.length>=6) w=w.slice(0,-2);
  const i=d.toLowerCase().indexOf(w); if(i<=60) return d.replace(/\n/g," ");
  const f=d.lastIndexOf(" ",i-60); return "…"+d.slice(f<0?0:f+1).replace(/\n/g," ");
}
function subFixes(code){
  if(fixUnsub){ fixUnsub(); fixUnsub=null; }
  if(!code) return;
  fixUnsub=onSnapshot(query(collection(db,"fixes"),where("code","==",code)), s=>{ fixes[code]=s.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); render(); });
}
function helpHtml(){
  if(kb===null&&!kbState) setTimeout(loadKb,0);
  const seg=`<div class="seg" style="margin:4px 0 6px">${["Аварии","Параметры","Брак","ИИ"].map((t,i)=>`<button class="${helpMode===i?"on":""}" data-act="hm" data-k="${i}">${t}</button>`).join("")}</div>`;
  const pchips=`<div class="chips">${[0,1,2,3,4,5,6].map(i=>`<button class="${helpPress===i?"on":""}" data-act="hp" data-k="${i}">${i?"Пресс "+i:"Все"}</button>`).join("")}</div>`;
  if(helpMode===2) return seg+pchips+casesHtml();
  if(helpMode===3) return seg+pchips+aiHtml();
  const found=helpFound(), pc=kb?kb.filter(a=>paramSources(0).includes(a.src)).length:0;
  const msg= (kbState==="loading"||!kbState)?"Загружаю справочник…": kbState==="empty"?"Справочник ещё не загружен: Профиль → «Загрузить справочник аварий» и выберите файл kb_alarms.json.":
    kbState==="error"?`Нет связи с базой. <button class="txt" data-act="kb_retry">Повторить</button>`:
    helpMode===1&&!pc?`<span style="color:var(--warn)">Параметров в справочнике пока нет: загрузите новый файл kb_alarms.json (Профиль → «Загрузить справочник аварий»).</span>`:
    helpMode===1&&!helpQ.trim()?`${pc} параметров и страниц пульта из руководств SACMI. Выберите пресс и введите слово: давление, деаэрация, толщина, засыпка, торможение…`:
    !helpQ.trim()?`В справочнике ${kb?kb.length-pc:0} аварий из руководств SACMI. Выберите пресс (1–3 старый пульт, 4–6 сенсорный) и введите номер с экрана.`:
    !found.length?"Ничего не найдено. Проверьте запрос или выберите «Все».":"";
  return seg+pchips+`<div id="hsbox"></div><div class="small" style="margin:4px 0 8px">${msg}</div>`+
  found.map(a=>{ const key=a.src+a.c+a.t+a.s, open=helpOpen===key, fx=fixes[a.c];
    return `<div class="al" data-act="al" data-k="${esc(key)}" data-c="${helpMode===0?a.c:""}"><div class="row">${a.c?`<span class="c">${a.c}</span>`:""}<b style="flex:1">${esc(a.t)}</b></div>
    <div class="small" style="${/блок/i.test(a.k)?"color:var(--bad)":""}">${[a.k,helpMode===1?a.s:"",kbNames[a.src]].filter(Boolean).map(esc).join(" · ")}</div>
    <div style="white-space:pre-line;${open?"":"display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden"}">${esc(!open&&a.d.length>300?kbSnippet(a.d,helpQ):a.d)}</div>${!open&&a.d.length>300?`<div class="small">Нажмите, чтобы открыть целиком</div>`:""}
    ${open&&helpMode===0?`<div style="color:var(--ok);font-weight:700;margin-top:6px">Как решали у нас</div>${!fx?"…":!fx.length?`<div class="small">Пока никто не записал. Будьте первым.</div>`:fx.map(f=>`<div class="fix">${esc(f.text)}<div class="small">${f.press?"Пресс "+f.press+" · ":""}${esc(f.nick)}, ${dayLabel(f.ts)} ${clock(f.ts)}</div></div>`).join("")}
    <button style="width:100%;margin-top:6px" data-act="fix_add" data-c="${a.c}" data-s="${a.src}">+ Как решили у нас</button>`:""}</div>`; }).join("");
}

/* ================= отрисовка ================= */
let lastChatLen=-1, searchBox=null;
function render(chatChanged){
  if(!user||!nick||!document.getElementById("main")) return;
  if(tab==="help"&&role!=="press") tab="dry";
  document.getElementById("hdr").innerHTML=headerHtml();
  document.getElementById("bar").innerHTML=brakBar();
  const main=document.getElementById("main"), keep=window.scrollY;
  main.innerHTML= tab==="dry"?dryHtml(): tab==="sch"?schemeHtml(): tab==="chat"?chatHtml(): tab==="help"?helpHtml(): journalHtml();
  if(tab==="help"){
    if(!searchBox){ searchBox=document.createElement("input"); searchBox.placeholder="Номер аварии или слова, например 2112"; searchBox.oninput=()=>{ helpQ=searchBox.value; helpOpen=null; render(); searchBox.focus(); }; }
    searchBox.placeholder= helpMode===1?"Слова: деаэрация, толщина, давление…":"Номер аварии или слова, например 2112";
    document.getElementById("hsbox")?.appendChild(searchBox);
  }
  document.body.className= tab==="chat"?"chat":"";
  document.getElementById("comp").style.display= tab==="chat"?"block":"none";
  if(tab==="chat"&&chat.length!==lastChatLen){ lastChatLen=chat.length; setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),0); }
  else window.scrollTo(0,keep);
  if(tab==="chat") ls("seen_chat",Date.now());
  if(tab==="jr") ls("seen_jr",Date.now());
  const unread=(arr,k)=>arr.filter(m=>m.ts>(+ls(k)||0)&&m.uid!==user.uid&&m.type!=="sys").length;
  const nc=tab==="chat"?0:unread(chat,"seen_chat"), nj=tab==="jr"?0:unread(journal,"seen_jr");
  const tabs=[["dry","🔥","Сушилки"],["sch","🧭","Цех"],["chat","💬","Чат",nc],["jr","📋","Журнал",nj]].concat(role==="press"?[["help","🛠","Помощь"]]:[]);
  document.getElementById("nav").innerHTML=tabs.map(([k,i,t,n])=>`<button class="${tab===k?"on":""}" data-act="tab" data-k="${k}">${i}<br>${t}${n?`<i>${n>99?"99+":n}</i>`:""}</button>`).join("");
}

/* ================= нажатия ================= */
document.addEventListener("input", e=>{ if(e.target.id==="aiq") aiDraft=e.target.value; });
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, d=DRYERS.find(x=>x.id===el.dataset.d);
  if(["accept","task_ack","photo","task_edit","task_del","fix_add"].includes(a)) e.stopPropagation();
  if(a==="tab"){ tab=el.dataset.k; ls("tab",tab); lastChatLen=-1; window.scrollTo(0,0); render(); }
  else if(a==="evsel"){ evsel=+el.dataset.k; render(); }
  else if(a==="fix") dlgFix(d);
  else if(a==="toggle"){ el.disabled=true; doToggle(d); }
  else if(a==="speed") dlgSpeed(d);
  else if(a==="add") dlgAdd();
  else if(a==="done"){ const t=tests.find(x=>x.id===+el.dataset.t); if(t){ const left=t.exitTs?0:remSec(t,evaOf(DRYERS.find(x=>x.name===t.dryer)),Date.now()); modal(t.exitTs?"Тест вышел на глазурь?":"Круг прошёл?", `<p>${t.dryer}: ${esc(t.design)}, полка ${pad3(t.testShelf)}</p>${left>600?`<p style="color:var(--warn);font-weight:700">По расчёту до конца круга ещё ${fmtDur(left)}. Точно круг прошёл?</p>`:""}`, ()=>t.exitTs?doDone(t):doExit(t), t.exitTs?"Да, вышел на глазурь":"Да, круг прошёл"); } }
  else if(a==="pinfo") pressInfo(+el.dataset.k);
  else if(a==="einfo") evaInfo(+el.dataset.k);
  else if(a==="params") dlgParams();
  else if(a==="output") dlgOutput();
  else if(a==="power"){ const ev=evaOf(d), on=!!ev.off; modal(on?`Включить ${d.name}?`:`Выключить ${d.name}?`, `<p>${on?"Ева снова будет считаться. Проверьте скорость.":"Выключенная Ева серая, тесты на неё не ставятся, простой не считается."}</p>`, ()=>{ doPower(d,on); if(on) setTimeout(()=>dlgSpeed(d),0); }, on?"Включить":"Выключить"); }
  else if(a==="tcancel"){ const t=tests.find(x=>x.id===+el.dataset.t); if(t){ if(Date.now()-t.id<180000) cancelTest(t); else modal("Удалить тест?", `<p>${t.dryer}: ${esc(t.design)}, полка ${pad3(t.testShelf)}. Тест пропадёт у всех.</p>`, ()=>cancelTest(t), "Удалить"); } }
  else if(a==="undoexit"){ const t=tests.find(x=>x.id===+el.dataset.t); if(t) undoExit(t); }
  else if(a==="accept"){ const m=journal.find(x=>x.id===el.dataset.m); if(m) doAccept(m); }
  else if(a==="brak") dlgBrak();
  else if(a==="accept_shift"){ ls("shift_"+user.uid,Date.now()); const s=sched(); log(nick+" принял смену"+(s&&s.mine?" ("+s.n+")":"")); render(); }
  else if(a==="handover") dlgHandOver();
  else if(a==="menu") dlgProfile();
  else if(a==="task_open"){ taskOpen=true; render(); }
  else if(a==="task_close"){ taskOpen=false; render(); }
  else if(a==="task_ack"){ if(task) setDoc(doc(db,"acks",task.ts+"_"+user.uid),{task:task.ts, uid:user.uid, nick}); taskOpen=false; render(); }
  else if(a==="task_edit") dlgTask();
  else if(a==="task_del"){ deleteDoc(doc(db,"config","shift_task")); taskOpen=false; }
  else if(a==="photo") viewPhoto(el.dataset.p, el.getAttribute("src").split(",")[1]);
  else if(a==="clear_chat"||a==="clear_jr"){ const ch=a==="clear_chat"?"general":"journal";
    modal(ch==="general"?"Очистить чат?":"Очистить журнал?","<p>Все записи будут удалены у всех.</p>",()=>{ (async()=>{ const s=await getDocs(collection(db,"chats",ch,"messages")); const docs=s.docs; for(let i=0;i<docs.length;i+=400){ const b=writeBatch(db); docs.slice(i,i+400).forEach(x=>b.delete(x.ref)); await b.commit(); } if(ch==="general") deleteDoc(doc(db,"config","shift_task")); toast("Удалено: "+docs.length); })(); },"Очистить"); }
  else if(a==="hp"){ helpPress=+el.dataset.k; render(); }
  else if(a==="hm"){ helpMode=+el.dataset.k; helpOpen=null; render(); }
  else if(a==="hdef"){ helpDef=el.dataset.k; render(); }
  else if(a==="case_add") dlgCase();
  else if(a==="ai_send") aiSend();
  else if(a==="ai_del"){ const id=el.dataset.k; if(id) modal("Удалить вопрос из истории?","",()=>{ deleteDoc(doc(db,"aiHistory",id)); },"Удалить"); else { aiList=aiList.filter(x=>x.q!==el.dataset.q||x.busy); render(); } }
  else if(a==="case_del"){ const id=el.dataset.k; modal("Удалить запись?","",()=>{ deleteDoc(doc(db,"cases",id)); },"Удалить"); }
  else if(a==="kb_retry"){ kb=null; kbState=""; render(); }
  else if(a==="al"){ const k=el.dataset.k; helpOpen=helpOpen===k?null:k; subFixes(helpOpen?el.dataset.c:null); render(); }
  else if(a==="fix_add"){ const code=el.dataset.c, src=el.dataset.s; let pr=helpPress;
    const ov=modal(`Авария ${code}: как решили`, `<div class="small">Пресс</div><div class="fm">${[1,2,3,4,5,6].map(i=>`<button data-p="${i}" class="${pr===i?"on":""}">${i}</button>`).join("")}</div><textarea id="ft" placeholder="Что сделали, что помогло"></textarea>`, o=>{
      const t=o.querySelector("#ft").value.trim(); if(!t) return false;
      addDoc(collection(db,"fixes"),{code, src, press:pr, text:t, uid:user.uid, nick, ts:Date.now()});
    });
    ov.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ pr=+b.dataset.p; ov.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===b)); }); }
});
/* живое обновление: сушилки и цех раз в 5 секунд, пока не открыто окно и не идёт ввод */
setInterval(()=>{
  if(!user||!nick||document.querySelector(".ov,.viewer")) return;
  if((tab==="dry"||tab==="sch")&&document.activeElement?.tagName!=="INPUT") render();
  else if(document.getElementById("hdr")) document.getElementById("hdr").innerHTML=headerHtml();
},5000);
window.addEventListener("resize",()=>{ if(tab==="sch") render(); });
</script>
